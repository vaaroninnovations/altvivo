# =============================================================================
# AltVivo PostgreSQL client authentication
# Evaluated top to bottom; first match wins.
# 172.30.10.0/24 is the internal-only altvivo_data Docker network.
# =============================================================================
# TYPE  DATABASE        USER                          ADDRESS            METHOD

# Unix socket - reachable only from inside the container (docker exec / init).
local   all             all                                              trust

# Loopback inside the container (healthchecks, maintenance).
host    all             all                           127.0.0.1/32       scram-sha-256

# Hub: core API (restricted DML role), migrations (schema owner), reporting.
host    db_core         core_app                      172.30.10.0/24     scram-sha-256
host    db_core         core_migrator                 172.30.10.0/24     scram-sha-256
host    db_core         core_readonly                 172.30.10.0/24     scram-sha-256

# Spokes: every spoke role may only reach the database with its own name
# (xprism -> xprism, amaze -> amaze, pharmadme -> pharmadme, ...).
host    sameuser        all                           172.30.10.0/24     scram-sha-256

# Everything else - including the superuser over TCP - is refused.
host    all             all                           0.0.0.0/0          reject
host    all             all                           ::/0               reject

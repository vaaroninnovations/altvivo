# =============================================================================
# Shared-VPS pass-through router (HAProxy 2.8+, Ubuntu's `haproxy` package)
#
# Owns the host's public ports 80/443 and sends each connection to the right
# stack WITHOUT decrypting it:
#
#   443  altvivo.bio, *.altvivo.bio  -> AltVivo Caddy   127.0.0.1:8443 (+ PROXY v2)
#   443  any other server name       -> other websites  127.0.0.1:9443
#    80  altvivo.bio, *.altvivo.bio  -> 301 to https (AltVivo uses DNS-01 certs)
#    80  any other host              -> other websites  127.0.0.1:9080
#
# The router holds no certificates or keys: each stack terminates its own TLS.
# Install:  sudo cp haproxy.cfg /etc/haproxy/haproxy.cfg
# Check:    sudo haproxy -c -f /etc/haproxy/haproxy.cfg
# Apply:    sudo systemctl reload haproxy
# =============================================================================

global
	log /dev/log local0
	log /dev/log local1 notice
	chroot /var/lib/haproxy
	stats socket /run/haproxy/admin.sock mode 660 level admin
	user haproxy
	group haproxy
	daemon
	maxconn 20000

defaults
	log global
	mode tcp
	option dontlognull
	timeout connect 5s
	# Long client/server timeouts keep WebSocket and streaming connections open.
	timeout client 1h
	timeout server 1h
	timeout tunnel 1h

# --------------------------------------------------------------------- HTTPS --
frontend https_in
	mode tcp
	bind :::443 v4v6
	option tcplog
	# Wait for the TLS ClientHello so the server name (SNI) can be read.
	tcp-request inspect-delay 5s
	tcp-request content accept if { req.ssl_hello_type 1 }

	acl altvivo_sni req.ssl_sni -i altvivo.bio
	acl altvivo_sni req.ssl_sni -i -m end .altvivo.bio
	use_backend altvivo_https if altvivo_sni
	default_backend other_https

backend altvivo_https
	mode tcp
	# PROXY v2 carries the visitor's real IP; AltVivo's Caddy expects it
	# (caddy/edge/router.caddy) and uses it for rate limits and audit logs.
	server caddy 127.0.0.1:8443 send-proxy-v2

backend other_https
	mode tcp
	# Plain TCP pass-through: the other websites see 127.0.0.1 as the client.
	# To give them real visitor IPs, add `send-proxy-v2` here and enable the
	# PROXY protocol on their listener (nginx: `listen 127.0.0.1:9443 ssl proxy_protocol;`).
	server web 127.0.0.1:9443

# ---------------------------------------------------------------------- HTTP --
frontend http_in
	mode http
	bind :::80 v4v6
	option httplog
	timeout http-request 10s
	timeout client 1m

	acl altvivo_host req.hdr(host),field(1,:) -i altvivo.bio
	acl altvivo_host req.hdr(host),field(1,:) -i -m end .altvivo.bio
	http-request redirect scheme https code 301 if altvivo_host
	default_backend other_http

backend other_http
	mode http
	timeout server 1m
	# Adds X-Forwarded-For so the other websites can log the visitor's IP.
	option forwardfor
	server web 127.0.0.1:9080

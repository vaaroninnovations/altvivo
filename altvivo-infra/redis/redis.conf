# =============================================================================
# AltVivo Redis 7 - sessions, refresh-token families, rate limits, queues
# Reachable only on the internal altvivo_data network.
# =============================================================================

# --- Network ---------------------------------------------------------------
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
tcp-keepalive 60
timeout 300

# --- Access control --------------------------------------------------------
# Per-service users with key-prefix isolation, generated by
# scripts/generate-secrets.sh. The 'default' user is disabled.
aclfile /usr/local/etc/redis/users.acl
acllog-max-len 256

# Dangerous admin commands are not granted to any application user via ACL
# (see users.acl). Debug and module loading are disabled outright.
enable-debug-command no
enable-module-command no
enable-protected-configs no

# --- Persistence -----------------------------------------------------------
# Refresh-token families and credit-reservation locks must survive restarts.
dir /data
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 900 1
save 300 100
save 60 10000
dbfilename dump.rdb
rdbcompression yes
rdbchecksum yes
stop-writes-on-bgsave-error yes

# --- Memory ----------------------------------------------------------------
# Never silently evict security state (refresh tokens / revocations).
maxmemory 640mb
maxmemory-policy noeviction

# --- Misc ------------------------------------------------------------------
databases 1
loglevel notice
logfile ""
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 256
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
